name: Elixir CI

on:
  workflow_call:
    inputs:
      enable-spark-formatter:
        description: "Run mix spark.formatter --check"
        type: boolean
        default: false
      enable-spark-cheat-sheets:
        description: "Run mix spark.cheat_sheets --check"
        type: boolean
        default: false
      enable-docs-deploy:
        description: "Deploy docs to GitHub Pages"
        type: boolean
        default: false
      enable-release:
        description: "Publish to Hex.pm on version tags"
        type: boolean
        default: true
    secrets:
      HEX_API_KEY:
        description: "Hex.pm API key for publishing"
        required: false

jobs:
  build-test:
    name: MIX_ENV=test mix compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: team-alembic/staple-actions/actions/install-elixir@488c794f93225c358bbec47152620a59c6f53e6a # main
      - name: Set OS deps compile partition count
        run: echo "MIX_OS_DEPS_COMPILE_PARTITION_COUNT=$(($(lscpu -p | grep -v '^#' | sort -u -t, -k 2,4 | wc -l) / 2))" >> $GITHUB_ENV
      - uses: team-alembic/staple-actions/actions/mix-compile@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: test
          args: "--warnings-as-errors"

  test:
    name: mix test
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: team-alembic/staple-actions/actions/mix-test@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: test

  version-matrix:
    name: Resolve version matrix
    runs-on: ubuntu-latest
    outputs:
      combos: ${{ steps.resolve.outputs.combos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve supported Elixir/OTP combinations
        id: resolve
        env:
          ELIXIR_BUILDS_URL: https://builds.hex.pm/builds/elixir/builds.txt
          OTP_BUILDS_URL: https://builds.hex.pm/builds/otp/ubuntu-24.04/builds.txt
        run: |
          set -euo pipefail

          pinned_elixir=$(awk '$1 == "elixir" {sub(/-otp-.*/, "", $2); print $2; exit}' .tool-versions)
          pinned_otp_major=$(awk '$1 == "erlang" {split($2, v, "."); print v[1]; exit}' .tool-versions)
          declared=$(grep -oE 'elixir:[[:space:]]*"[^"]*"' mix.exs | grep -oE '[0-9]+\.[0-9]+' | head -1)

          if [ -z "$pinned_elixir" ] || [ -z "$pinned_otp_major" ] || [ -z "$declared" ]; then
            echo "could not determine version bounds:" >&2
            echo "  mix.exs declares: ${declared:-<none>}" >&2
            echo "  .tool-versions pins: ${pinned_elixir:-<none>} / ${pinned_otp_major:-<none>}" >&2
            exit 1
          fi

          pinned_minor=$(echo "$pinned_elixir" | cut -d. -f1,2)

          # "1.19.5 28" per line, one line per publicly built Elixir/OTP pair.
          elixir_combos=$(curl -fsSL "$ELIXIR_BUILDS_URL" \
            | awk '{print $1}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-otp-[0-9]+$' \
            | sed 's/^v//; s/-otp-/ /')

          latest_otp_per_major=$(curl -fsSL "$OTP_BUILDS_URL" \
            | awk '{print $1}' \
            | grep -E '^OTP-[0-9]+\.[0-9]+' \
            | sed 's/^OTP-//' \
            | sort -V \
            | awk -F. '{latest[$1] = $0} END {for (m in latest) print m, latest[m]}' \
            | sort -n)

          # The pinned minor is excluded: build-test and test already cover it,
          # and at the exact patch the repo pins rather than the latest.
          minors=$(echo "$elixir_combos" \
            | awk '{split($1, v, "."); print v[1] "." v[2]}' \
            | sort -uV \
            | awk -v lo="$declared" -v hi="$pinned_minor" '
                function num(v) { split(v, p, "."); return p[1] * 1000 + p[2] }
                num($0) >= num(lo) && num($0) < num(hi)')

          combos=""
          for minor in $minors; do
            patch=$(echo "$elixir_combos" | awk -v m="$minor." 'index($1, m) == 1 {print $1}' | sort -uV | tail -1)
            otp_major=$(echo "$elixir_combos" \
              | awk -v ver="$patch" -v cap="$pinned_otp_major" '$1 == ver && $2 + 0 <= cap + 0 {print $2}' \
              | sort -n | tail -1)
            [ -n "$otp_major" ] || continue
            erlang=$(echo "$latest_otp_per_major" | awk -v m="$otp_major" '$1 == m {print $2}')
            [ -n "$erlang" ] || continue
            combos="${combos}${combos:+,}{\"elixir\":\"${patch}\",\"erlang\":\"${erlang}\",\"otp_major\":\"${otp_major}\"}"
          done

          echo "mix.exs admits >= ${declared}; .tool-versions pins ${pinned_elixir}/OTP ${pinned_otp_major}"
          echo "combos=[${combos}]" | tee -a "$GITHUB_OUTPUT"

  compatibility:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp_major }}
    runs-on: ubuntu-latest
    needs: version-matrix
    if: ${{ needs.version-matrix.outputs.combos != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version-matrix.outputs.combos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rewriting .tool-versions rather than calling setup-beam directly: every
      # staple action installs Elixir from that file, so an explicit setup-beam
      # step would just be overwritten.
      - name: Pin .tool-versions to the matrix combination
        env:
          MATRIX_ELIXIR: "${{ matrix.elixir }}-otp-${{ matrix.otp_major }}"
          MATRIX_ERLANG: ${{ matrix.erlang }}
        run: |
          set -euo pipefail
          awk -v elixir="$MATRIX_ELIXIR" -v erlang="$MATRIX_ERLANG" '
            $1 == "elixir" { print "elixir " elixir; next }
            $1 == "erlang" { print "erlang " erlang; next }
            { print }
          ' .tool-versions > .tool-versions.matrix
          mv .tool-versions.matrix .tool-versions
          cat .tool-versions
      # cache-prefix is load-bearing: only the _build cache hashes
      # .tool-versions, while the MIX_HOME and HEX_HOME caches key on the
      # mix.lock hash alone. Without a per-combination prefix a leg restores
      # the Hex archive the pinned Elixir compiled and dies on the version
      # mismatch — Elixir 1.19 has no Enum.__in__/2 for a 1.20 archive to call.
      #
      # No --warnings-as-errors here: older Elixir versions emit warnings the
      # pinned one does not, and this job is about compiling and passing, not
      # warning hygiene. build-test covers that on the pinned version.
      - uses: team-alembic/staple-actions/actions/mix-test@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: test
          cache-prefix: elixir-${{ matrix.elixir }}-otp-${{ matrix.otp_major }}

  credo:
    name: mix credo --strict
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: team-alembic/staple-actions/actions/mix-credo@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: test
      - name: Run Credo SAST
        uses: team-alembic/staple-actions/actions/mix-task@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: test
          task: credo --format sarif > results.sarif
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
          category: credo

  formatter:
    name: mix format --check-formatted
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: team-alembic/staple-actions/actions/mix-format@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: test

  spark-formatter:
    name: mix spark.formatter --check
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ inputs.enable-spark-formatter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: team-alembic/staple-actions/actions/mix-task@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: test
          task: spark.formatter --check

  spark-cheat-sheets:
    name: mix spark.cheat_sheets --check
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ inputs.enable-spark-cheat-sheets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: team-alembic/staple-actions/actions/mix-task@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: test
          task: spark.cheat_sheets --dry-run --yes
      - uses: team-alembic/staple-actions/actions/mix-task@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: test
          task: spark.cheat_sheets --check

  dialyzer:
    name: mix dialyzer
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: team-alembic/staple-actions/actions/mix-dialyzer@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: test

  audit:
    name: mix deps.audit + hex.audit
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: team-alembic/staple-actions/actions/mix-hex-audit@488c794f93225c358bbec47152620a59c6f53e6a # main
      - uses: team-alembic/staple-actions/actions/mix-task@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: test
          task: deps.audit

  unused-deps:
    name: mix deps.unlock --check-unused
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: team-alembic/staple-actions/actions/mix-task@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: test
          task: deps.unlock --check-unused

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: REUSE compliance check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6

  build-docs:
    name: mix docs
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: team-alembic/staple-actions/actions/mix-docs@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: dev
          use-cache: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: doc/

  deploy-docs:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: canary
    if: ${{ !cancelled() && needs.canary.result == 'success' && inputs.enable-docs-deploy && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  canary:
    name: canary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
      - version-matrix
      - compatibility
      - credo
      - formatter
      - spark-formatter
      - spark-cheat-sheets
      - dialyzer
      - audit
      - unused-deps
      - reuse
      - build-docs
    steps:
      - name: Check all jobs passed
        run: |
          # Required jobs must succeed
          if [[ "${{ needs.test.result }}" != "success" ]]; then exit 1; fi
          # Required, not optional: a failure here skips compatibility, which
          # would otherwise read as a legitimate "no versions to test".
          if [[ "${{ needs.version-matrix.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.credo.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.formatter.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.dialyzer.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.audit.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.unused-deps.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.reuse.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.build-docs.result }}" != "success" ]]; then exit 1; fi
          # Optional jobs must succeed or be skipped
          # compatibility is skipped when mix.exs admits no version below the pinned one
          if [[ "${{ needs.compatibility.result }}" != "success" && "${{ needs.compatibility.result }}" != "skipped" ]]; then exit 1; fi
          if [[ "${{ needs.spark-formatter.result }}" != "success" && "${{ needs.spark-formatter.result }}" != "skipped" ]]; then exit 1; fi
          if [[ "${{ needs.spark-cheat-sheets.result }}" != "success" && "${{ needs.spark-cheat-sheets.result }}" != "skipped" ]]; then exit 1; fi
          echo "All checks passed!"

  release:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    needs: canary
    if: ${{ !cancelled() && needs.canary.result == 'success' && inputs.enable-release && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract release notes from CHANGELOG.md
        id: extract-notes
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}

          # Extract the section for this version from CHANGELOG.md
          awk -v version="$VERSION" '
            /^## \[v?[0-9]/ {
              if (found) exit
              if (index($0, "[v" version "]") || index($0, "[" version "]")) {
                found = 1
                next
              }
            }
            found {
              if (/^## \[v?[0-9]/) exit
              print
            }
          ' CHANGELOG.md > release_notes.md

          # Check if notes were found
          if [ -s release_notes.md ]; then
            echo "has_notes=true" >> $GITHUB_OUTPUT
            echo "Release notes extracted for version $VERSION"
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
            echo "No release notes found for version $VERSION, will use auto-generated notes"
          fi
      - name: Create prerelease with changelog notes
        if: ${{ (contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-pre')) && steps.extract-notes.outputs.has_notes == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            --repo ${{ github.repository }} \
            --title ${GITHUB_REF#refs/tags/} \
            --prerelease \
            --notes-file release_notes.md \
            ${GITHUB_REF#refs/tags/}
      - name: Create prerelease with generated notes
        if: ${{ (contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-pre')) && steps.extract-notes.outputs.has_notes != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            --repo ${{ github.repository }} \
            --title ${GITHUB_REF#refs/tags/} \
            --prerelease \
            --generate-notes \
            ${GITHUB_REF#refs/tags/}
      - name: Create release with changelog notes
        if: ${{ (!contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-pre')) && steps.extract-notes.outputs.has_notes == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            --repo ${{ github.repository }} \
            --title ${GITHUB_REF#refs/tags/} \
            --notes-file release_notes.md \
            ${GITHUB_REF#refs/tags/}
      - name: Create release with generated notes
        if: ${{ (!contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-pre')) && steps.extract-notes.outputs.has_notes != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            --repo ${{ github.repository }} \
            --title ${GITHUB_REF#refs/tags/} \
            --generate-notes \
            ${GITHUB_REF#refs/tags/}
      - uses: team-alembic/staple-actions/actions/mix-hex-publish@488c794f93225c358bbec47152620a59c6f53e6a # main
        with:
          mix-env: test
          hex-api-key: ${{ secrets.HEX_API_KEY }}
